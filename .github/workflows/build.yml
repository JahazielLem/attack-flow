name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  pages: write
  pull-requests: write

jobs:
  test_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org/ | python -
      - name: Add Poetry to PATH
        run: echo "$HOME/.poetry/bin" >> $GITHUB_PATH
      - name: Install Python dependencies
        run: poetry install --with api,docs
      - name: Check code formatting
        run: poetry run black --check src/attack_flow/
      - name: Run unit tests
        run: poetry run make test-ci
      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_SECRET }}
          files: coverage.xml
          verbose: true

  test_attack_flow_builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        working-directory: ./src/attack_flow_builder/
        run: npm ci --include=dev
      - name: Lint
        working-directory: ./src/attack_flow_builder/
        run: npm run lint
      - name: Run unit tests
        working-directory: ./src/attack_flow_builder/
        run: npm run test:unit

  attack_flow_builder:
    needs: ["test_attack_flow_builder"]
    runs-on: ubuntu-latest
    env:
      AFB_BASE_URL: "${{ format('/{0}/ui/', github.event.repository.name) }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        working-directory: ./src/attack_flow_builder/
        run: npm ci --include=dev
      - name: Build
        working-directory: ./src/attack_flow_builder/
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: attack-flow-builder
          path: src/attack_flow_builder/dist/

  attack_flow_builder_v2:
    needs: ["test_attack_flow_builder"]
    runs-on: ubuntu-latest
    env:
      AFB_BASE_URL: "${{ format('/{0}/ui-v2/', github.event.repository.name) }}"
    steps:
      - uses: actions/checkout@v5
        with:
          repository: center-for-threat-informed-defense/attack-flow
          ref: v2.3.3
      - uses: actions/setup-node@v6
        with:
          node-version: "19"
      - name: Install dependencies
        working-directory: ./src/attack_flow_builder/
        run: npm ci --include=dev
      - name: Build
        working-directory: ./src/attack_flow_builder/
        env:
          # Workaround for node.js bug: https://github.com/webpack/webpack/issues/14532
          NODE_OPTIONS: "--openssl-legacy-provider"
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: builder-v2
          path: src/attack_flow_builder/dist/

  comment_flow_links:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v6
        env:
          PR_NUMBER: ${{ github.event.number }}
        with:
          script: |
            const { PR_NUMBER, GITHUB_SHA } = process.env;
            const builderUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/ui/?src=`;
            const { owner, repo } = context.repo;
            const rawRepo = context.payload.pull_request?.head?.repo?.full_name ?? `${owner}/${repo}`;
            const rawSha = context.payload.pull_request?.head?.sha ?? GITHUB_SHA;
            const baseRawUrl = `https://raw.githubusercontent.com/${rawRepo}`;
            const response = await github.rest.pulls.listFiles({
              owner,
              repo,
              "pull_number": PR_NUMBER,
              "per_page": 50,
              "page": 1,
            });
            const bullets = [];
            for (const file of response.data) {
              if (file.filename.startsWith("corpus/")) {
                const flowName = file.filename.split("/").pop();
                const flowArg = `${baseRawUrl}/${rawSha}/corpus/${flowName}`;
                console.log(flowArg)
                const flowUrl = builderUrl + encodeURIComponent(flowArg);
                bullets.push(`* [${flowName}](${flowUrl})`);
              }
            }
            if (bullets.length > 0) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: "Open this PR's flows in Attack Flow Builder:\n\n" + bullets.join("\n") + "\n",
              })
            }

  render_site:
    needs: ["test_python", "attack_flow_builder", "attack_flow_builder_v2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
      - name: Update APT
        run: sudo apt update
      - name: Install APT dependencies
        run: sudo apt install graphviz
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org/ | python -
      - name: Add Poetry to PATH
        run: echo "$HOME/.poetry/bin" >> $GITHUB_PATH
      - name: Install Python dependencies
        run: poetry install --with api,docs
      - name: Install Node dependencies
        working-directory: ./src/attack_flow_builder/
        run: npm ci --include=dev
      - name: Create client directory
        run: mkdir docs/extra/ui
      - name: Download Attack Flow Builder
        uses: actions/download-artifact@v4
        with:
          name: attack-flow-builder
          path: docs/extra/ui
      - name: Create v2 directory
        run: mkdir docs/extra/ui-v2
      - name: Download v2 Builder
        uses: actions/download-artifact@v4
        with:
          name: builder-v2
          path: docs/extra/ui-v2
      - name: Make Attack Flow schema
        run: poetry run make docs-schema
      - name: Validate Corpus
        run: poetry run make validate
      - name: Copy corpus into docs
        env:
          DOCS_BASE_URL: "${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
          DOCS_BUILDER_URL: "${{ format('https://{0}.github.io/{1}/ui/', github.repository_owner, github.event.repository.name) }}"
        run: poetry run make docs-examples
      - name: Copy matrix-viz code into docs
        run: poetry run make docs-matrix
      - name: Build HTML docs
        run: poetry run make docs
      - name: Upload HTML docs
        uses: actions/upload-artifact@v4
        with:
          name: attack-flow-docs-html
          path: docs/_build/dirhtml/

  deploy_prod:
    if: github.ref == 'refs/heads/main'
    needs: render_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download HTML docs
        uses: actions/download-artifact@v4
        with:
          name: attack-flow-docs-html
          path: docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

